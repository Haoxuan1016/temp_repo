<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" content="#f3efe6" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SAT 核心词汇闪卡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3efe6;
      --bg-deep: #ebe6db;
      --paper: #faf7f0;
      --paper-2: #fffdf8;
      --ink: #1c1b17;
      --ink-soft: #6e6b62;
      --ink-faint: #9a968c;
      --line: rgba(28, 27, 23, 0.09);
      --line-strong: rgba(28, 27, 23, 0.16);
      --accent: #c45d3a;
      --accent-soft: #f0d8ce;
      --ok: #2c6a4a;
      --ok-soft: #d7ebe0;
      --bad: #b03d2c;
      --bad-soft: #f3d6d0;
      --shadow: 0 1px 1px rgba(28, 27, 23, 0.04), 0 18px 40px rgba(28, 27, 23, 0.07);
      --ease-swift: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-exit: cubic-bezier(0.4, 0.0, 0.2, 1);
      --ease-snap: cubic-bezier(0.22, 0.61, 0.36, 1);
      --font-ui: "Source Sans 3", "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
      --font-word: "Source Serif 4", "Times New Roman", "Songti SC", "Noto Serif SC", serif;
      --font-zh: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--font-ui);
      background:
        radial-gradient(900px 420px at 50% -8%, #fffaf3 0%, transparent 60%),
        var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: hidden;
    }
    button, input { font-family: inherit; }
    button { cursor: pointer; border: none; background: none; color: inherit; }
    ::selection { background: var(--accent-soft); }

    .app {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 28px 20px 36px;
    }

    .shell {
      width: min(560px, 100%);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* —— Home —— */
    .brand {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .eyebrow::before {
      content: "";
      width: 18px;
      height: 1.5px;
      background: var(--accent);
    }
    h1 {
      font-family: var(--font-word);
      font-size: clamp(34px, 6vw, 44px);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }
    .lede {
      color: var(--ink-soft);
      font-size: 16px;
      line-height: 1.55;
      max-width: 36em;
    }

    .levels {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }
    .level-btn {
      text-align: left;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 18px 16px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset;
      transition: transform 0.28s var(--ease-swift), background 0.2s ease, border-color 0.2s ease;
    }
    .level-btn:hover {
      transform: translateY(-2px);
      border-color: var(--line-strong);
      background: var(--paper-2);
    }
    .level-btn:active { transform: translateY(0) scale(0.99); }
    .level-btn.wide { grid-column: 1 / -1; }
    .level-btn .kicker {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-faint);
    }
    .level-btn .name {
      display: block;
      margin-top: 6px;
      font-family: var(--font-word);
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .level-btn .meta {
      display: block;
      margin-top: 4px;
      color: var(--ink-soft);
      font-size: 13px;
    }

    .home-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 2px 0;
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--ink-soft);
      font-size: 14px;
      user-select: none;
    }
    .switch {
      position: relative;
      width: 40px;
      height: 24px;
      border-radius: 999px;
      background: var(--bg-deep);
      border: 1px solid var(--line-strong);
      transition: background 0.25s var(--ease-swift);
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--paper-2);
      box-shadow: 0 1px 3px rgba(28,27,23,0.2);
      transition: transform 0.28s var(--ease-swift);
    }
    .toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .toggle input:checked + .switch { background: var(--ink); border-color: var(--ink); }
    .toggle input:checked + .switch::after { transform: translateX(16px); }
    .footnote {
      font-size: 12px;
      color: var(--ink-faint);
    }

    /* —— Study chrome —— */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .ghost {
      height: 36px;
      padding: 0 12px;
      border-radius: 999px;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 500;
      border: 1px solid transparent;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .ghost:hover { background: rgba(28,27,23,0.05); color: var(--ink); }
    .progress-block { text-align: right; }
    .track { margin-top: -8px; }
    .progress-label {
      font-size: 13px;
      color: var(--ink-soft);
      font-variant-numeric: tabular-nums;
    }
    .progress-label b { color: var(--ink); font-weight: 600; }
    .track {
      height: 3px;
      background: rgba(28,27,23,0.08);
      border-radius: 99px;
      overflow: hidden;
    }
    .fill {
      height: 100%;
      width: 0%;
      background: var(--ink);
      border-radius: inherit;
      transition: width 0.4s var(--ease-swift);
    }

    .stage {
      position: relative;
      height: min(58vh, 430px);
      perspective: 1200px;
    }
    .card {
      position: absolute;
      inset: 0;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px 32px 32px;
      overflow: hidden;
      user-select: none;
      touch-action: manipulation;
      will-change: transform, opacity;
    }
    .card.waiting {
      transform: translateY(12px) scale(0.97);
      opacity: 0.48;
      z-index: 1;
      pointer-events: none;
      filter: saturate(0.92);
      transition:
        transform 0.4s var(--ease-swift),
        opacity 0.4s var(--ease-swift);
    }
    .card.active {
      z-index: 3;
      cursor: pointer;
      transition:
        transform 0.42s var(--ease-swift),
        opacity 0.32s ease;
    }
    .card.fly-left,
    .card.fly-right {
      z-index: 5;
      pointer-events: none;
      transition:
        transform 0.32s var(--ease-exit),
        opacity 0.24s linear;
    }
    .card.fly-left {
      transform: translateX(-32vw) rotate(-10deg) scale(0.97);
      opacity: 0;
      box-shadow: -18px 12px 40px rgba(44, 106, 74, 0.08);
    }
    .card.fly-right {
      transform: translateX(32vw) rotate(10deg) scale(0.97);
      opacity: 0;
      box-shadow: 18px 12px 40px rgba(176, 61, 44, 0.08);
    }
    .card.instant { transition: none !important; }

    .card-id {
      position: absolute;
      top: 18px;
      left: 22px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--ink-faint);
    }
    .hint-tap {
      position: absolute;
      top: 18px;
      right: 22px;
      font-size: 12px;
      color: var(--ink-faint);
    }

    .word-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      transform: translateY(22px);
      transition: transform 0.28s var(--ease-swift);
    }
    .card.revealed .word-wrap { transform: translateY(-12px); }

    .word {
      font-family: var(--font-word);
      font-size: clamp(40px, 8vw, 56px);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.15;
      font-optical-sizing: auto;
    }
    .pos {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: lowercase;
      color: var(--ink-faint);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.28s ease, transform 0.36s var(--ease-swift);
    }
    .meaning {
      margin-top: 18px;
      max-width: 28em;
      opacity: 0;
      transform: translateY(16px);
      filter: blur(4px);
      transition:
        opacity 0.32s ease 40ms,
        transform 0.4s var(--ease-swift) 30ms,
        filter 0.4s var(--ease-swift) 30ms;
    }
    .card.revealed .pos,
    .card.revealed .meaning {
      opacity: 1;
      transform: none;
      filter: none;
    }
    .zh {
      font-family: var(--font-zh);
      font-size: 20px;
      font-weight: 500;
      line-height: 1.45;
      letter-spacing: 0.01em;
    }
    .en {
      margin-top: 10px;
      font-family: var(--font-word);
      font-size: 15px;
      line-height: 1.5;
      color: var(--ink-soft);
      font-style: italic;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .act {
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
      border: 1px solid var(--line);
      background: var(--paper);
      transition: transform 0.22s var(--ease-swift), background 0.2s ease, border-color 0.2s;
    }
    .act:hover { transform: translateY(-1px); }
    .act:active { transform: scale(0.98); }
    .act.bad { color: var(--bad); }
    .act.bad:hover { background: var(--bad-soft); border-color: transparent; }
    .act.ok { color: var(--ok); }
    .act.ok:hover { background: var(--ok-soft); border-color: transparent; }
    .act kbd {
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(28,27,23,0.06);
      color: var(--ink-soft);
    }
    .keys {
      text-align: center;
      font-size: 12px;
      color: var(--ink-faint);
      letter-spacing: 0.02em;
    }
    .keys span { margin: 0 8px; }
    .keys b { color: var(--ink-soft); font-weight: 600; }

    /* —— Results —— */
    .results-shell {
      width: min(640px, 100%);
      max-height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .copy-bar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .primary {
      flex: 1;
      height: 48px;
      border-radius: 14px;
      background: var(--ink);
      color: var(--paper);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: transform 0.22s var(--ease-swift), opacity 0.2s;
    }
    .primary:hover { transform: translateY(-1px); }
    .primary:active { transform: scale(0.985); }
    .primary.copied { background: var(--ok); }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .stat {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 12px;
      text-align: center;
    }
    .stat .n {
      font-family: var(--font-word);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .stat .l { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
    .miss-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 4px 2px 0;
    }
    .miss-head h2 {
      font-family: var(--font-word);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .list {
      overflow: auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 20px;
      max-height: min(48vh, 420px);
    }
    .row {
      display: grid;
      grid-template-columns: 84px minmax(0, 1fr);
      gap: 8px 14px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      align-items: baseline;
    }
    .row:last-child { border-bottom: none; }
    .row .id {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }
    .row .w {
      font-family: var(--font-word);
      font-size: 18px;
      font-weight: 600;
    }
    .row .z {
      grid-column: 2;
      font-size: 13px;
      color: var(--ink-soft);
      margin-top: -4px;
    }
    .empty {
      padding: 48px 24px;
      text-align: center;
      color: var(--ink-soft);
    }
    .empty .big {
      font-family: var(--font-word);
      font-size: 28px;
      color: var(--ink);
      margin-bottom: 8px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 16px);
      background: var(--ink);
      color: var(--paper);
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease, transform 0.36s var(--ease-swift);
      z-index: 20;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .hidden { display: none !important; }

    @media (max-width: 520px) {
      .app { padding: 16px 14px 24px; align-items: stretch; }
      .stage { height: min(52vh, 380px); }
      .card { padding: 28px 20px; border-radius: 22px; }
      .word { font-size: 40px; }
      .levels { grid-template-columns: 1fr; }
      .level-btn .name { font-size: 24px; }
      .level-btn.wide { grid-column: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  
    .stage {
      height: min(38vh, 280px);
    }
    .card.active { cursor: default; }
    .word-wrap { transform: none; }
    .card.revealed .word-wrap { transform: translateY(-6px); }
    .pos {
      opacity: 1;
      transform: none;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .topbar #back { justify-self: start; }
    .progress-block { text-align: center; }
    .pause-btn {
      justify-self: end;
      height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--line-strong);
      background: var(--paper);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .pause-btn:hover { background: var(--paper-2); }
    .pause-btn[aria-pressed="true"] {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }

    .study-wrap { position: relative; }

    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr 14px 1fr 1fr;
      gap: 10px;
      direction: ltr;
    }
    .choice[data-key="a"] { grid-column: 1; }
    .choice[data-key="f"] { grid-column: 2; }
    .choice[data-key="j"] { grid-column: 4; }
    .choice[data-key="l"] { grid-column: 5; }
    .choice {
      min-height: 92px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 8px;
      text-align: left;
      padding: 12px 12px 14px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid var(--line);
      background: var(--paper);
      transition: transform 0.22s var(--ease-swift), background 0.2s ease, border-color 0.2s, box-shadow 0.2s;
    }
    .choice:hover { transform: translateY(-1px); border-color: var(--line-strong); background: var(--paper-2); }
    .choice:active { transform: scale(0.985); }
    .choice kbd {
      font-family: var(--font-ui);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(28,27,23,0.06);
      color: var(--ink-soft);
    }
    .choice .choice-text {
      font-family: var(--font-zh);
      font-size: 14px;
      line-height: 1.4;
      letter-spacing: 0.01em;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      width: 100%;
    }
    .choice.correct {
      background: var(--ok-soft);
      border-color: transparent;
      color: var(--ok);
      box-shadow: 0 0 0 1px rgba(44,106,74,0.18);
    }
    .choice.correct kbd { background: rgba(44,106,74,0.12); color: var(--ok); }
    .choice.wrong {
      background: var(--bad-soft);
      border-color: transparent;
      color: var(--bad);
    }
    .choice.wrong kbd { background: rgba(176,61,44,0.12); color: var(--bad); }
    .choice.dim { opacity: 0.55; }
    .choice:disabled { cursor: default; transform: none; }

    .pause-overlay {
      position: absolute;
      inset: 0;
      z-index: 8;
      background: rgba(243, 239, 230, 0.78);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      padding: 24px;
    }
    .pause-overlay .pause-title {
      font-family: var(--font-word);
      font-size: 32px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .pause-overlay .pause-note { color: var(--ink-soft); font-size: 14px; line-height: 1.55; }

    .resume-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
    }
    .resume-bar .resume-copy { flex: 1; min-width: 0; }
    .resume-bar .resume-title { font-weight: 600; font-size: 14px; }
    .resume-bar .resume-meta { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
    .resume-bar .primary { flex: 0 0 auto; height: 40px; padding: 0 16px; width: auto; }
    .resume-bar .ghost { height: 40px; }

    .study-stack {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    @media (max-width: 640px) {
      .choices {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .choice[data-key="a"],
      .choice[data-key="f"],
      .choice[data-key="j"],
      .choice[data-key="l"] { grid-column: auto; }
      .choice { min-height: 84px; padding: 10px; }
      .stage { height: min(32vh, 240px); }
      .topbar { gap: 8px; }
      .pause-btn { padding: 0 10px; }
    }

  </style>
</head>

<body>
  <div class="app">
    <section class="shell" id="home">
      <div class="brand">
        <div class="eyebrow">Shenzhen Gengdu</div>
        <h1>SAT 核心词汇闪卡</h1>
        <p class="lede">看英文，从四个中文含义里选一个。从左到右对应键盘 <b>A</b>、<b>F</b>、<b>J</b>、<b>L</b>，也可以直接点选。右上角暂停会把进度写入本地，离开也不丢。</p>
      </div>
      <div class="resume-bar hidden" id="resumeBar">
        <div class="resume-copy">
          <div class="resume-title">未完成的进度</div>
          <div class="resume-meta" id="resumeMeta"></div>
        </div>
        <button class="primary" id="resumeBtn" type="button">继续</button>
        <button class="ghost" id="discardBtn" type="button">放弃</button>
      </div>
      <div class="levels">
        <button class="level-btn" data-level="1">
          <span class="kicker">Level 01</span>

l":3,"fakes":["噪点；障碍","噱头，规矩"]},{"id":"L3-296","word":"debut","pos":"n./v.","zh":"首次亮相；首次亮相","en":"The first appearance or performance of something; to make a first appearance or performance","level":3,"fakes":["余味，回味","虚名；口头禅"]},{"id":"L3-297","word":"atrocity","pos":"n.","zh":"暴行，滔天大罪","en":"An extremely wicked or cruel act; a brutal or heinous crime","level":3,"fakes":["暗涌，嗜好","暗账，疑心"]}]</script>
  <script>
    const VOCAB = JSON.parse(document.getElementById("vocab-data").textContent);
    const BY_ID = Object.fromEntries(VOCAB.map((w) => [w.id, w]));
    const STORE_KEY = "gengdu-sat-quiz-v1";
    const KEYS = ["a", "f", "j", "l"];

    const $ = (id) => document.getElementById(id);
    const home = $("home");
    const study = $("study");
    const results = $("results");
    const cardA = $("cardA");
    const cardB = $("cardB");
    const toastEl = $("toast");
    const overlay = $("pauseOverlay");
    const pauseBtn = $("pauseBtn");
    const choiceBtns = KEYS.map((k) => document.querySelector(`.choice[data-key="${k}"]`));

    const counts = { 1: 0, 2: 0, 3: 0 };
    VOCAB.forEach((w) => { counts[w.level]++; });
    $("c1").textContent = counts[1] + " 词";
    $("c2").textContent = counts[2] + " 词";
    $("c3").textContent = counts[3] + " 词";
    $("call").textContent = VOCAB.length + " 词";

    let deck = [];
    let i = 0;
    let missed = [];
    let locked = false;
    let paused = false;
    let active = cardA;
    let waiting = cardB;
    let toastTimer = 0;
    let currentQ = null;
    let levelChosen = "1";
    let shuffleOn = true;
    let sessionSeed = 1;
    let advanceTimer = 0;

    const wait = (ms) => new Promise((r) => setTimeout(r, ms));

    function shuffle(arr, rand) {
      const a = arr.slice();
      const r = rand || Math.random;
      for (let n = a.length - 1; n > 0; n--) {
        const j = Math.floor(r() * (n + 1));
        [a[n], a[j]] = [a[j], a[n]];
      }
      return a;
    }

    function seeded(str) {
      let h = 2166136261;
      const s = String(str);
      for (let n = 0; n < s.length; n++) {
        h ^= s.charCodeAt(n);
        h = Math.imul(h, 16777619);
      }
      let x = (h >>> 0) || 1;
      return () => {
        x ^= x << 13; x >>>= 0;
        x ^= x >> 17; x >>>= 0;
        x ^= x << 5; x >>>= 0;
        return x / 4294967296;
      };
    }

    function posGroup(pos) {
      const p = String(pos || "").toLowerCase();
      if (p.startsWith("adj")) return "adj";
      if (p.startsWith("n")) return "n";
      if (p.startsWith("v")) return "v";
      return "other";
    }

    function normZh(s) {
      return String(s || "")
        .replace(/[,，]/g, "，")
        .replace(/[;；]/g, "；")
        .replace(/\s+/g, "")
        .trim();
    }

    function esc(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function pickOtherZh(item) {
      const g = posGroup(item.pos);
      const same = VOCAB.filter((w) => w.id !== item.id && posGroup(w.pos) === g && normZh(w.zh) !== normZh(item.zh));
      const pool = same.length ? same : VOCAB.filter((w) => w.id !== item.id && normZh(w.zh) !== normZh(item.zh));
      const r = seeded(sessionSeed + ":" + item.id + ":other");
      return pool[Math.floor(r() * pool.length)].zh;
    }

    function makeQuestion(item) {
      const other = pickOtherZh(item);
      const used = new Set([normZh(item.zh), normZh(other)]);
      const fakes = [];
      for (const f of item.fakes || []) {
        if (!used.has(normZh(f))) {
          fakes.push(f);
          used.add(normZh(f));
        }
        if (fakes.length === 2) break;
      }
      let n = 0;
      while (fakes.length < 2) {
        n += 1;
        const t = "虚构干扰义·" + n;
        if (!used.has(normZh(t))) {
          fakes.push(t);
          used.add(normZh(t));
        }
      }
      const parts = [
        { text: item.zh, ok: true },
        { text: other, ok: false },
        { text: fakes[0], ok: false },
        { text: fakes[1], ok: false }
      ];
      const shuffled = shuffle(parts, seeded(sessionSeed + ":" + item.id + ":order"));
      return {
        options: shuffled.map((p) => p.text),
        correct: shuffled.findIndex((p) => p.ok)
      };
    }

    function cardHTML(item, showMeaning) {
      if (!item) return "";
      return `
        <span class="card-id">${item.id}</span>
        <span class="hint-tap">${showMeaning ? "权威释义" : "四选一"}</span>
        <div class="word-wrap">
          <div class="word">${esc(item.word)}</div>
          <div class="pos">${esc(item.pos)}</div>
          <div class="meaning">
            <div class="zh">${esc(item.zh)}</div>
            <div class="en">${esc(item.en)}</div>
          </div>
        </div>`;
    }

    function paintProgress() {
      const n = deck.length;
      const now = Math.min(i + 1, n);
      $("pnow").textContent = n ? now : 0;
      $("ptotal").textContent = n;
      $("plevel").textContent = deck[i] ? deck[i].id : "";
      $("pfill").style.width = n ? ((i / n) * 100) + "%" : "0%";
    }

    function show(el) {
      home.classList.toggle("hidden", el !== home);
      study.classList.toggle("hidden", el !== study);
      results.classList.toggle("hidden", el !== results);
      if (el !== study) setPaused(false, { persistFlag: false });
    }

    function paintChoices() {
      const q = currentQ;
      choiceBtns.forEach((btn, idx) => {
        btn.disabled = !q || locked || paused;
        btn.classList.remove("correct", "wrong", "dim");
        const text = q ? q.options[idx] : "";
        btn.querySelector(".choice-text").textContent = text || "";
      });
    }

    function persist(extra) {
      if (!deck.length || i >= deck.length) return;
      const payload = {
        v: 1,
        level: levelChosen,
        shuffle: shuffleOn,
        seed: sessionSeed,
        deckIds: deck.map((w) => w.id),
        i,
        missedIds: missed.map((w) => w.id),
        currentQ,
        paused,
        savedAt: Date.now()
      };
      Object.assign(payload, extra || {});
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(payload));
      } catch (err) {
        toast("无法写入本地进度");
      }
      refreshResumeBar();
    }

    function clearSession() {
      try { localStorage.removeItem(STORE_KEY); } catch {}
      refreshResumeBar();
    }

    function loadSession() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) return null;
        const s = JSON.parse(raw);
        if (!s || s.v !== 1 || !Array.isArray(s.deckIds) || !s.deckIds.length) return null;
        if (s.i < 0 || s.i >= s.deckIds.length) return null;
        if (!s.deckIds.every((id) => BY_ID[id])) return null;
        return s;
      } catch {
        return null;
      }
    }

    function formatSaved(ts) {
      if (!ts) return "";
      const d = new Date(ts);
      const pad = (n) => String(n).padStart(2, "0");
      return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function levelLabel(level) {
      if (level === "all") return "全部词汇";
      if (level === "1") return "Level 01 基础";
      if (level === "2") return "Level 02 进阶";
      if (level === "3") return "Level 03 高阶";
      return "词表";
    }

    function refreshResumeBar() {
      const bar = $("resumeBar");
      const s = loadSession();
      if (!s) {
        bar.classList.add("hidden");
        return;
      }
      bar.classList.remove("hidden");
      $("resumeMeta").textContent =
        `${levelLabel(String(s.level))} · 第 ${s.i + 1} / ${s.deckIds.length} 题 · 保存于 ${formatSaved(s.savedAt)}`;
    }

    function setPaused(next, opts) {
      const persistFlag = !opts || opts.persistFlag !== false;
      paused = !!next;
      overlay.classList.toggle("hidden", !paused);
      pauseBtn.setAttribute("aria-pressed", paused ? "true" : "false");
      pauseBtn.innerHTML = paused ? "▶ 继续" : "⏸ 暂停";
      choiceBtns.forEach((btn) => { btn.disabled = !currentQ || locked || paused; });
      if (paused && persistFlag) {
        persist();
        toast("已暂停，进度已保存");
      }
    }

    function applySession(s) {
      levelChosen = String(s.level);
      shuffleOn = !!s.shuffle;
      sessionSeed = s.seed || 1;
      deck = s.deckIds.map((id) => BY_ID[id]);
      i = s.i;
      missed = (s.missedIds || []).map((id) => BY_ID[id]).filter(Boolean);
      currentQ = s.currentQ || makeQuestion(deck[i]);
      locked = false;
      active = cardA;
      waiting = cardB;
      active.className = "card active";
      waiting.className = "card waiting";
      renderPair({ keepQuestion: true });
      show(study);
      persist();
    }

    function start(level) {
      const q = new URLSearchParams(location.search);
      levelChosen = String(level);
      deck = VOCAB.filter((w) => level === "all" || w.level === Number(level));
      shuffleOn = q.has("shuffle") ? q.get("shuffle") !== "0" : $("shuffle").checked;
      sessionSeed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0 || 1;
      if (shuffleOn) deck = shuffle(deck);
      const n = Number(q.get("n"));
      if (n > 0) deck = deck.slice(0, n);
      i = 0;
      missed = [];
      locked = false;
      currentQ = null;
      active = cardA;
      waiting = cardB;
      active.className = "card active";
      waiting.className = "card waiting";
      renderPair();
      show(study);
      persist();
    }

    function renderPair(opts) {
      const keep = opts && opts.keepQuestion;
      if (!keep) currentQ = deck[i] ? makeQuestion(deck[i]) : null;
      active.classList.remove("revealed", "fly-left", "fly-right");
      waiting.classList.remove("revealed", "fly-left", "fly-right");
      active.innerHTML = cardHTML(deck[i], false);
      waiting.innerHTML = cardHTML(deck[i + 1], false);
      waiting.style.visibility = deck[i + 1] ? "visible" : "hidden";
      paintProgress();
      paintChoices();
    }

    async function answerSlot(slot) {
      if (paused || locked || !deck[i] || !currentQ) return;
      if (slot < 0 || slot > 3) return;
      locked = true;
      const ok = slot === currentQ.correct;
      if (!ok) missed.push(deck[i]);

      choiceBtns.forEach((btn, idx) => {
        btn.disabled = true;
        if (idx === currentQ.correct) btn.classList.add("correct");
        else if (idx === slot && !ok) btn.classList.add("wrong");
        else btn.classList.add("dim");
      });
      active.classList.add("revealed");
      const hint = active.querySelector(".hint-tap");
      if (hint) hint.textContent = ok ? "正确" : "正确答案已标出";

      persist();
      const delay = ok ? 850 : 1450;
      advanceTimer = 1;
      await wait(delay);
      while (paused && advanceTimer) await wait(120);
      if (!advanceTimer || study.classList.contains("hidden")) return;

      const outgoing = active;
      const incoming = waiting;
      outgoing.classList.add(ok ? "fly-left" : "fly-right");

      if (i + 1 >= deck.length) {
        await wait(300);
        finish();
        return;
      }

      incoming.classList.remove("waiting");
      incoming.classList.add("active");
      active = incoming;
      waiting = outgoing;
      i += 1;
      currentQ = makeQuestion(deck[i]);
      paintProgress();
      paintChoices();
      persist();
      await wait(300);

      waiting.classList.add("instant");
      waiting.className = "card waiting instant";
      waiting.innerHTML = cardHTML(deck[i + 1], false);
      waiting.style.visibility = deck[i + 1] ? "visible" : "hidden";
      waiting.offsetHeight;
      waiting.classList.remove("instant");
      locked = false;
      paintChoices();
    }

    function finish() {
      locked = true;
      advanceTimer = 0;
      $("pfill").style.width = "100%";
      $("sTotal").textContent = deck.length;
      $("sOk").textContent = deck.length - missed.length;
      $("sBad").textContent = missed.length;
      $("missCount").textContent = missed.length ? missed.length + " 个" : "";
      const list = $("missList");
      if (!missed.length) {
        list.innerHTML = `<div class="empty"><div class="big">全部答对</div>这轮没有错题。复制结果会得到空数组 []。</div>`;
      } else {
        list.innerHTML = missed.map((w) => `
          <div class="row">
            <div class="id">${w.id}</div>
            <div class="w">${esc(w.word)}</div>
            <div class="z">${esc(w.zh)}</div>
          </div>`).join("");
      }
      $("copyBtn").textContent = missed.length
        ? `复制结果 JSON · ${missed.length}`
        : "复制结果 JSON";
      $("copyBtn").classList.remove("copied");
      clearSession();
      show(results);
      locked = false;
    }

    function missedJSON() {
      return JSON.stringify(
        missed.map((w) => ({ word: w.word, id: w.id })),
        null,
        2
      );
    }

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1600);
    }

    async function copyJSON() {
      const text = missedJSON();
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
      $("copyBtn").classList.add("copied");
      $("copyBtn").textContent = "已复制";
      toast(missed.length ? `已复制 ${missed.length} 个错词` : "已复制空数组");
      setTimeout(() => {
        $("copyBtn").classList.remove("copied");
        $("copyBtn").textContent = missed.length
          ? `复制结果 JSON · ${missed.length}`
          : "复制结果 JSON";
      }, 1400);
    }

    function resumeFromStore() {
      const s = loadSession();
      if (!s) {
        toast("没有可继续的进度");
        return;
      }
      applySession(s);
      setPaused(false, { persistFlag: false });
      persist();
      toast("已恢复进度");
    }

    document.querySelectorAll(".level-btn").forEach((btn) => {
      btn.addEventListener("click", () => start(btn.dataset.level));
    });
    $("back").addEventListener("click", () => {
      advanceTimer = 0;
      persist();
      locked = false;
      show(home);
      refreshResumeBar();
    });
    $("again").addEventListener("click", () => show(home));
    $("copyBtn").addEventListener("click", copyJSON);
    $("resumeBtn").addEventListener("click", resumeFromStore);
    $("discardBtn").addEventListener("click", () => {
      clearSession();
      toast("已放弃上次进度");
    });
    pauseBtn.addEventListener("click", () => {
      if (study.classList.contains("hidden")) return;
      setPaused(!paused);
    });
    choiceBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        const slot = KEYS.indexOf(btn.dataset.key);
        answerSlot(slot);
      });
    });

    refreshResumeBar();

    const boot = new URLSearchParams(location.search);
    if (boot.get("shuffle") === "0") $("shuffle").checked = false;
    if (boot.get("resume") === "1") {
      resumeFromStore();
    } else if (boot.get("level")) {
      start(boot.get("level"));
      if (boot.get("end") === "1") {
        missed = deck.slice(0, Math.min(3, deck.length));
        finish();
      }
    }

    window.addEventListener("keydown", (e) => {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = (e.target && e.target.tagName) || "";
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      if (study.classList.contains("hidden")) return;
      const key = e.key.toLowerCase();
      if (key === "escape") {
        e.preventDefault();
        setPaused(!paused);
        return;
      }
      if (paused || locked) return;
      const slot = KEYS.indexOf(key);
      if (slot !== -1) {
        e.preventDefault();
        answerSlot(slot);
      }
    });

    window.addEventListener("pagehide", () => persist());
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") persist();
    });

  </script>
</body>
</html>
